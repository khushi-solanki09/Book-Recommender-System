<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOOK RECOMMEND</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css"
    />

      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background: #0d0d0d;
        font-family: "Poppins", sans-serif;
        color: #fff;
        padding-bottom: 50px;
      }
      .navbar {
        background: linear-gradient(90deg, #14c2c9, #1aa3b8);
        border: none;
        border-radius: 0;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }
      .navbar-brand {
        font-weight: 700;
        font-size: 24px;
        color: white !important;
      }
      .nav > li > a {
        color: white !important;
        font-size: 16px;
        font-weight: 500;
      }
      h1 {
        font-size: 50px;
        font-weight: 600;
        margin-top: 30px;
        margin-bottom: 10px;
      }
      .book-card {
        background: #181818;
        border-radius: 15px;
        padding: 15px;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
        box-shadow: 0 0 0 rgba(0, 0, 0, 0);
        height: 420px;
      }
      .book-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 8px 25px rgba(255, 255, 255, 0.08);
      }
      .book-img {
        width: 100%;
        height: 250px;
        object-fit: contain;
        background: #fff;
        border-radius: 10px;
        padding: 10px;
      }
      .book-title {
        font-weight: 600;
        margin-top: 10px;
        font-size: 16px;
      }
      .book-author,
      .book-meta {
        font-size: 14px;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <div class="navbar-header">
          <a class="navbar-brand">My Book Recommender</a>
        </div>
        <ul class="nav navbar-nav navbar-right">
          <li><a href="/">Home</a></li>
          <li><a href="/recommend">Recommend</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </div>
    </nav>

<div class="container">
        <div class="row">
            <div class="col-md-12">
                <h1 class="text-white" style="font-size:50px">Recommend Books</h1>
                <form action="/recommend_books" method="post">
                    <input name="user_input" type="text" class="form-control" placeholder="e.g. Harry Potter, The Alchemist..."><br>
                    <input type="submit" class="btn btn-lg btn-warning" value="Get Recommendations">
                </form>

                {% if error %}
                <div style="margin-top:20px; padding:15px; background:#ff4c4c22; border:1px solid #ff4c4c; border-radius:10px; color:#ff6b6b;">
                    <strong>⚠ {{ error }}</strong>
                </div>
                {% endif %}

                {% if searched_title %}
                <p style="margin-top:15px; color:#14c2c9; font-size:16px;">
                    📖 Showing recommendations for: <strong>{{ searched_title }}</strong>
                </p>
                {% endif %}
            </div>

            {% if data %}
             {% for i in data %}
                <div class="col-md-3" style="margin-top:30px">
                    <div class="book-card">
                        <img class="book-img" src="{{i[2]}}" onerror="this.src='https://via.placeholder.com/150x220?text=No+Cover'">
                        <p class="book-title">{{i[0]}}</p>
                        <p class="book-author">✍ {{i[1]}}</p>
                    </div>
                </div>
             {% endfor %}
            {% endif %}

        </div>
    </div>

</body>
</html>
